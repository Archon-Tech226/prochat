{% extends 'base.html' %}

{% block title %}Create Team — ProChat{% endblock %}
{% block nav_chat %}active{% endblock %}
{% block page_title %}Create Team{% endblock %}

{% block content %}
<div style="max-width:480px;margin:0 auto">
    <div class="card">
        <h2 style="font-size:18px;font-weight:800;color:var(--text);margin-bottom:20px">Create a new team</h2>

        <form method="POST" action="{% url 'create_group' %}">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Team name</label>
                <input type="text" name="name" class="form-input" placeholder="e.g. Design Team, Study Group" required>
            </div>

            <div class="form-group">
                <label class="form-label">Team type</label>
                <select name="group_type" class="form-input">
                    <option value="company">🏢 Company / Corporate</option>
                    <option value="project">🔧 Project Team</option>
                    <option value="classroom">🎓 Classroom / Study Group</option>
                    <option value="community">🌐 Open Community</option>
                </select>
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
                    <input type="checkbox" name="is_public" style="width:16px;height:16px;accent-color:var(--violet)">
                    <div>
                        <div class="form-label" style="margin:0">Make public</div>
                        <div style="font-size:11px;color:var(--text3)">Anyone can find and join this team</div>
                    </div>
                </label>
            </div>

            <div style="display:flex;gap:10px;margin-top:8px">
                <button type="submit" class="btn-primary" style="flex:1;justify-content:center">Create Team →</button>
                <a href="{% url 'group_list' %}" class="btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
