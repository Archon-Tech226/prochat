{% extends 'base.html' %}

{% block title %}Add Task — ProChat{% endblock %}
{% block nav_tasks %}active{% endblock %}
{% block page_title %}Add Task{% endblock %}

{% block content %}
<div style="max-width:480px;margin:0 auto">
    <div class="card">
        <h2 style="font-size:18px;font-weight:800;color:var(--text);margin-bottom:20px">Add a new task</h2>

        <form method="POST" action="{% url 'create_task' %}">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Task title *</label>
                <input type="text" name="title" class="form-input" placeholder="What needs to be done?" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-input" placeholder="Add details..." rows="3"></textarea>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Due date</label>
                    <input type="date" name="due_date" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Priority</label>
                    <select name="priority" class="form-input">
                        <option value="low">🟢 Low</option>
                        <option value="medium" selected>🟡 Medium</option>
                        <option value="high">🔴 High</option>
                        <option value="urgent">🚨 Urgent</option>
                    </select>
                </div>
            </div>

            <div style="display:flex;gap:10px;margin-top:8px">
                <button type="submit" class="btn-primary" style="flex:1;justify-content:center">Add Task →</button>
                <a href="{% url 'task_list' %}" class="btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
